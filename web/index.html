<!doctype html>
<html lang="en" data-theme="dark" data-accent="amber">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark light">
<meta name="description" content="Autumn Diffusion — local image, video and music generation on ComfyUI and YuE.">
<title>Autumn Diffusion</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23f0a24b'/%3E%3Cpath d='M22 7c-8 1-13 6-13 13 0 2 .6 4 .6 4s2-6 7-9c-4 4-5 9-5 9s1 0 2 .2C21 22 25 15 22 7z' fill='%231a1206'/%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/app.css">
</head>
<body data-reduced-motion="0">

<header class="topbar">
  <div class="brand" title="Autumn Diffusion — everything in one folder">
    <span class="brand-mark" aria-hidden="true">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M20 4c-9 1-14 7-14 15 0 0 2.4-7.5 8.5-10.5C10.5 13 9.5 19 9.5 19c8-.6 12-8 10.5-15z"/></svg>
    </span>
    <span class="brand-name">Autumn Diffusion</span>
    <span class="brand-ver" id="version"></span>
  </div>

  <nav class="tabs" id="tabs" aria-label="Generation tabs"></nav>

  <span class="top-spacer"></span>

  <div class="topbar-right">
    <button class="pill" id="engine-pill" title="Engine status — click for actions" type="button"></button>
    <span class="pill" id="queue-pill" title="Queue"></span>
    <span class="meter" id="vram-meter" title="Memory">
      <span class="track"><span class="fill"></span></span>
      <span class="num"></span>
    </span>
    <div class="topbar-buttons" id="topbar-buttons"></div>
  </div>
</header>

<main class="workspace" id="workspace">
  <aside class="rail" id="rail">
    <div class="rail-head" id="rail-head">
      <span class="rail-title" id="rail-title">Settings</span>
      <span class="grow"></span>
      <input class="input sm" id="rail-search" placeholder="Filter settings…" spellcheck="false" autocomplete="off">
    </div>
    <div class="rail-scroll" id="rail-scroll"></div>
    <nav class="rail-nav hidden" id="rail-nav" aria-label="Settings sections"></nav>
  </aside>

  <div class="resizer resizer-v" id="resizer-rail" title="Drag to resize · double-click to reset"></div>

  <section class="center-col">
    <div class="view" id="gen-view">
      <div id="stage-host"></div>
      <div id="music-host" class="hidden"></div>
      <div class="composer-host" id="composer-host"></div>
      <div class="actionbar" id="actionbar"></div>
    </div>

    <div class="view hidden" id="assets-view"></div>
    <div class="settings-wrap hidden" id="settings-view"></div>

    <div class="log-drawer" id="log-drawer" aria-hidden="true"></div>
  </section>

  <div class="resizer resizer-v" id="resizer-side" title="Drag to resize · double-click to reset"></div>

  <aside class="sidebar" id="sidebar"></aside>

  <div class="resizer resizer-h" id="resizer-history" title="Drag to resize · double-click to reset"></div>

  <div class="history" id="history"></div>
</main>

<div class="toasts" aria-live="polite"></div>
<div class="modal-root"></div>
<div id="setup-host"></div>

<noscript><p style="padding:24px">Autumn Diffusion needs JavaScript. The dashboard is a local web app.</p></noscript>

<script type="module" src="/static/js/app.js"></script>
</body>
</html>
